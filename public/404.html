<!DOCTYPE html>
<html>
<head>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>The page you were looking for cannot be found (404)</title>
  <style>
    body {
      color: #666;
      text-align: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: auto;
      font-size: 14px;
    }

    hr {
      max-width: 800px;
      margin: 18px auto;
      border: 0;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #fff;
    }

    a {
      color: #4a8bee;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .uf-error-text {
      display: inline-block;
      margin-top: 5vw;
    }

    /* A watermark, not a message: the readable copy is .med and below. */
    .big {
      color: #eee;
      font-size: 20vw;
      font-weight: 700;
      line-height: 80%;
      margin-top: 4%;
    }

    .med {
      color: #666;
      font-size: 2.5vw;
      line-height: 90%;
      max-width: 60vw;
      margin: 0 auto;
    }

    .container {
      margin: 35px 20px 0;
      font-size: 18px;
    }

    .go-back {
      display: none;
      margin-top: 20px;
      font-weight: 400;
    }

    .unfurl-logo {
      display: block;
      width: 20vw;
      height: auto;
      margin: 40px auto;
    }
  </style>
</head>

<body>
  <div class="uf-error-text">
    <div class="big">404</div>
    <div class="med">The page you were looking for cannot be found or you don't have permission to view it</div>
  </div>
  <div class="container">
    <hr />
    <p>Make sure the address is correct and that the page hasn't moved.</p>
    <p>Please contact <a href="mailto:support@onecommons.org">support@onecommons.org</a> if this problem persists.</p>
    <a href="javascript:history.back()" class="js-go-back go-back">Go back</a>
    <img src="/-/oc/assets/unfurl-logo.svg" alt="Unfurl Cloud" class="unfurl-logo" />
  </div>
  <script>
    (function () {
      var goBack = document.querySelector('.js-go-back');

      if (history.length > 1) {
        goBack.style.display = 'inline';
      }
    })();
  </script>
</body>
</html>
