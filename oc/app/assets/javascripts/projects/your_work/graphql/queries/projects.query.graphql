#import "~/graphql_shared/fragments/page_info.fragment.graphql"
#import "~/graphql_shared/fragments/project.fragment.graphql"

# @feature_category: groups_and_projects
query ocYourWorkProjects(
  $active: Boolean = true
  $membership: Boolean = false
  $unfurlType: OCUnfurlType
  $minAccessLevel: AccessLevelEnum
  $first: Int
  $last: Int
  $before: String
  $after: String
  $sort: String
  $search: String
) {
  projects(
    active: $active
    membership: $membership
    unfurlType: $unfurlType
    minAccessLevel: $minAccessLevel
    first: $first
    last: $last
    before: $before
    after: $after
    sort: $sort
    search: $search
  ) {
    nodes {
      ...Project
    }
    pageInfo {
      ...PageInfo
    }
    count
  }
}
