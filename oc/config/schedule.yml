# Sidekiq Cron Jobs default schedules for the oc edition, loaded beside
# config/schedule.yml by Gitlab::SidekiqConfig::CronJobs
---

# Nightly reconcile of work items sync branches, and a weekly unfiltered
# sweep behind it (Sunday 03:15, after the nightly has run).
oc_work_items_reconcile_worker:
  class: OC::WorkItems::ReconcileWorker
  cron: "15 2 * * *"

oc_work_items_sweep_worker:
  class: OC::WorkItems::SweepWorker
  cron: "15 3 * * 0"

# Hourly, so each run has little to do; see the worker for why the cutoff is
# an age rather than a consumer's cursor.
oc_projects_prune_cloudmap_events_worker:
  class: OC::Projects::PruneCloudmapEventsWorker
  cron: "35 * * * *"

# Every minute, so a metadata change reaches the cloudmap promptly; a run with
# nothing queued costs one Redis call.
oc_projects_cloudmap_refresh_worker:
  class: OC::Projects::CloudmapRefreshWorker
  cron: "* * * * *"
