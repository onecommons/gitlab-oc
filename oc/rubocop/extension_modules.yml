# Modules that extend an upstream top-level class through prepend_mod_with are
# named after that class, so they cannot sit in a bounded context. Upstream
# lists its own in .rubocop_todo/gitlab/bounded_contexts.yml.
Gitlab/BoundedContexts:
  Exclude:
    - 'oc/app/finders/oc/projects_finder.rb'
    - 'oc/app/graphql/oc/resolvers/projects_resolver.rb'
    - 'oc/app/models/oc/environment.rb'
    - 'oc/app/serializers/oc/build_detail_entity.rb'
    - 'oc/app/serializers/oc/environment_entity.rb'
    - 'oc/app/models/oc/issue.rb'
    - 'oc/app/models/oc/merge_request.rb'
    - 'oc/app/models/oc/project.rb'
    - 'oc/app/models/oc/repository.rb'
    - 'oc/app/models/oc/user.rb'
    - 'oc/app/graphql/oc/types/project_type.rb'
    - 'oc/app/graphql/oc/types/work_item_type.rb'
    - 'oc/app/policies/oc/issuable_policy.rb'
    - 'oc/app/policies/oc/project_policy.rb'
    - 'oc/app/services/oc/award_emojis/add_service.rb'
    - 'oc/app/services/oc/award_emojis/destroy_service.rb'
    - 'oc/app/services/oc/git/base_hooks_service.rb'
    - 'oc/app/services/oc/git/branch_hooks_service.rb'
    - 'oc/app/services/oc/issuable/destroy_service.rb'
    - 'oc/app/services/oc/issues/base_service.rb'
    - 'oc/app/services/oc/merge_requests/base_service.rb'
    - 'oc/app/services/oc/notes/destroy_service.rb'
    - 'oc/app/services/oc/notes/post_process_service.rb'
    - 'oc/app/services/oc/notes/update_service.rb'
    - 'oc/app/services/oc/notification_service.rb'
    - 'oc/app/services/oc/post_receive_service.rb'
    - 'oc/app/services/oc/projects/update_service.rb'
    - 'oc/app/workers/oc/project_cache_worker.rb'
    - 'oc/app/workers/oc/repository_fork_worker.rb'
    - 'oc/lib/oc/gitlab/checks/single_change_access.rb'
