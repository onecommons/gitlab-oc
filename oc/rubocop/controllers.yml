# Controllers are the application layer, which upstream exempts from bounded
# contexts (see config/bounded_contexts.yml). Upstream lists its own top-level
# controllers in .rubocop_todo/gitlab/namespaced_class.yml.
Gitlab/NamespacedClass:
  Exclude:
    - 'oc/app/controllers/**/*.rb'

# An extension module is named after the controller it prepends, so it cannot
# take a namespace the upstream class does not have either.
Search/NamespacedClass:
  Exclude:
    - 'oc/app/controllers/oc/search_controller.rb'
