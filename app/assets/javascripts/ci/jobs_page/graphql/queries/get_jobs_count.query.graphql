query getJobsCount(
  $fullPath: ID!
  $statuses: [CiJobStatus!]
  $sources: [CiJobSource!]
  $name: String
  $varDeployPath: String # OC Change
) {
  project(fullPath: $fullPath) {
    id
    jobs(statuses: $statuses, sources: $sources, name: $name, varDeployPath: $varDeployPath) {
      count
    }
  }
}
