---
name: ci

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rubocop:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Needed to diff against the base; the default shallow clone has no
          # merge-base to compare with.
          fetch-depth: 0

      # Native extensions the Gemfile builds from source: pg, re2,
      # charlock_holmes, gpgme, grpc, nokogiri and timfel-krb5-auth. Without these the bundle
      # fails during install rather than during the lint.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libpq-dev libre2-dev libicu-dev libgpgme-dev libkrb5-dev

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          bundler-cache: true

      # Linting the whole tree would report upstream's offenses as ours. The
      # fork's own rule is that an offense is yours if you touched the file, so
      # this matches lefthook's rubocop hook: changed Ruby files only.
      - name: Collect changed Ruby files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          elif [ -n "${{ github.event.before }}" ] &&
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base='${{ github.event.before }}'
          else
            # First push of a branch reports no predecessor.
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only --diff-filter=d "$base" '${{ github.sha }}' \
            -- '*.rb' '*.rake' > changed.txt || true
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed Ruby files:"; cat changed.txt

      # --force-exclusion so .rubocop.yml's Exclude lists still apply when a
      # path is named explicitly, which is not the default.
      - name: RuboCop
        if: steps.changed.outputs.count != '0'
        run: |
          REVEAL_RUBOCOP_TODO=0 xargs < changed.txt \
            bundle exec rubocop --parallel --force-exclusion --no-server

  # e2e only when yarn.lock changed: that is where the oc-pages pin lives, so a
  # changed lock is a changed unfurl-gui to test against this commit. Other
  # pushes would only retest what the last one did, at ~25 minutes a run.
  lockfile:
    name: yarn.lock changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      unfurl_gui_ref: ${{ steps.diff.outputs.unfurl_gui_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No base on a manual run, or on a push that created the branch.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$BASE" "$HEAD" -- yarn.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          ref=$(git show "$HEAD:yarn.lock" | grep -m1 'resolution: "oc-pages@' \
            | sed -n 's/.*[&#]commit=\([0-9a-f]\{40\}\).*/\1/p')
          echo "unfurl_gui_ref=$ref" >> "$GITHUB_OUTPUT"

  e2e:
    needs: lockfile
    if: ${{ needs.lockfile.outputs.changed == 'true' }}
    uses: ./.github/workflows/e2e.yml
    with:
      unfurl_gui_ref: ${{ needs.lockfile.outputs.unfurl_gui_ref }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
