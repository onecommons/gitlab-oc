---
name: gdk image

# NOTE: a scheduled workflow only runs from the repository's DEFAULT branch.
# This file has to be on main to fire.
"on":
  schedule:
    - cron: '17 4 * * 0'   # Sundays, early
  workflow_dispatch:
    inputs:
      ref:
        description: Fork ref to bake into the image
        required: false
        default: main
      rebuild_base:
        description: Rebuild gdk:base too (off reuses the last one)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A runner starts with ~31 GB free of 84 GB; this reclaims ~31 GB more.
      # large-packages stays on: it removes google-chrome, which only the e2e
      # job needs, and this job does not.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GDK's own GDK-in-a-Box recipe with its install step swapped for ours,
      # which installs this fork rather than GitLab EE. GDK's CI copies the same
      # two files into the context before building.
      - name: Prepare the GDK base
        if: inputs.rebuild_base != false
        run: |
          git clone --depth=1 https://gitlab.com/gitlab-org/gitlab-development-kit.git "$RUNNER_TEMP/gdk"
          cd "$RUNNER_TEMP/gdk"
          cp packages_debian.txt .mise-version support/gdk-in-a-box/container/
          cp "$GITHUB_WORKSPACE/oc/support/ci/install-config-gdk.sh" support/gdk-in-a-box/container/

      # No credentials are passed to either build: the fork is public, so they
      # clone it anonymously and nothing lands in a layer.
      - name: Build and push the GDK base
        if: inputs.rebuild_base != false
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/gdk/support/gdk-in-a-box/container
          push: true
          tags: ghcr.io/onecommons/gitlab-oc/gdk:base

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: oc/support/ci
          file: oc/support/ci/Dockerfile
          push: true
          build-args: |
            OC_REF=${{ inputs.ref || 'main' }}
          tags: |
            ghcr.io/onecommons/gitlab-oc/gdk:latest
            ghcr.io/onecommons/gitlab-oc/gdk:${{ github.run_number }}
