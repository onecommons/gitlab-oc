---
name: gdk image

# NOTE: a scheduled workflow only runs from the repository's DEFAULT branch.
# This file has to be on main to fire, and builds the port branch explicitly
# rather than whatever main happens to hold.
"on":
  schedule:
    - cron: '17 4 * * 0'   # Sundays, early
  workflow_dispatch:
    inputs:
      ref:
        description: Fork ref to bake into the image
        required: false
        default: v19.3.0-oc

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A runner starts with ~31 GB free of 84 GB; this reclaims ~31 GB more.
      # large-packages stays on: it removes google-chrome, which only the e2e
      # job needs, and this job does not.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No credentials are passed: the fork is public, so the image build
      # clones it anonymously and nothing lands in a layer.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: oc/support/ci
          file: oc/support/ci/Dockerfile
          push: true
          build-args: |
            OC_REF=${{ inputs.ref || 'v19.3.0-oc' }}
          tags: |
            ghcr.io/onecommons/gitlab-oc/gdk:latest
            ghcr.io/onecommons/gitlab-oc/gdk:${{ github.run_number }}
