---
name: e2e

# Callable from either side of the pair, because there are two questions:
# does this fork ref work with the oc-pages it ships (called from here, with
# unfurl_gui_ref taken from yarn.lock), and does unfurl-gui HEAD still work
# against the fork (called from there, with its own ref).
"on":
  workflow_call:
    inputs:
      gdk_image:
        type: string
        default: ghcr.io/onecommons/gitlab-oc/gdk:latest
      unfurl_image:
        type: string
        description: >-
          Unfurl server image. The :local-cloud-endpoint tag carries the rust
          proxy and the optional python deps a pipx install would skip.
        default: ghcr.io/onecommons/unfurl:local-cloud-endpoint
      unfurl_gui_ref:
        type: string
        required: true
      ref:
        type: string
        default: ''
        description: >-
          Fork ref to test. Empty tests the image as built; set, the GDK is moved
          to it first (gems, node modules, translations, migrations), ~10 minutes
      save_logs:
        type: boolean
        default: false
        description: Upload the GDK and unfurl logs even when the run passes
      specs:
        type: string
        # minecraft first: each run signs up a user whose dashboard is empty
        # until something deploys, and route_smoke and light_mode need its rows.
        description: Comma-separated cypress specs known to pass on a GDK
        default: >-
          cypress/e2e/blueprints/aws__minecraft__minecraft.cy.js,cypress/e2e/00_visitor/route_smoke.cy.js,cypress/e2e/00_visitor/light_mode.cy.js,cypress/e2e/00_visitor/visit_cloudchart.cy.js,cypress/e2e/deployments/smorgasbord.cy.js
  workflow_dispatch:
    inputs:
      unfurl_gui_ref:
        required: true
      ref:
        required: false
        default: ''
        description: >-
          Fork ref to test. Empty tests the image as built; set, the GDK is moved
          to it first (gems, node modules, translations, migrations), ~10 minutes
      unfurl_image:
        required: false
        default: ghcr.io/onecommons/unfurl:local-cloud-endpoint
      save_logs:
        type: boolean
        default: false

# workflow_call defaults do not reach a workflow_dispatch run, which lacks these
# inputs, so the fallbacks repeat them.
env:
  GDK_IMAGE: ${{ inputs.gdk_image || 'ghcr.io/onecommons/gitlab-oc/gdk:latest' }}
  SPECS: ${{ inputs.specs || 'cypress/e2e/blueprints/aws__minecraft__minecraft.cy.js,cypress/e2e/00_visitor/route_smoke.cy.js,cypress/e2e/00_visitor/light_mode.cy.js,cypress/e2e/00_visitor/visit_cloudchart.cy.js,cypress/e2e/deployments/smorgasbord.cy.js' }}

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      # large-packages would take google-chrome with it, which cypress needs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - uses: actions/checkout@v4
        with:
          repository: onecommons/unfurl-gui
          ref: ${{ inputs.unfurl_gui_ref }}
          path: unfurl-gui

      # gdk.test, never localhost: integration-test.js treats a localhost
      # OC_URL as the standalone harness and would silently test the wrong
      # artifact rather than the fork.
      - name: Resolve gdk.test
        run: echo "127.0.0.1 gdk.test" | sudo tee -a /etc/hosts

      # Bind mounts rather than `docker logs`, so a crashed container still
      # leaves its files behind and one artifact carries every side of the run.
      # World-writable because each image runs as its own user, and none of them
      # is the runner's uid.
      - name: Prepare log directories
        run: mkdir -p logs/gdk-services logs/gdk-rails logs/unfurl && chmod -R 777 logs

      # On its own so the ~6 GB pull shows progress; `docker run -d` is silent.
      - name: Pull the GDK image
        run: docker pull "$GDK_IMAGE"

      # Host networking, like the unfurl server below: the HTTP router binds
      # gdk.test, i.e. loopback, which a published port cannot reach, and the
      # GDK has to reach the unfurl server on the runner's 8081. gdk.test must
      # resolve in the container too, or the router cannot start.
      - name: Start the GDK
        env:
          REF: ${{ inputs.ref }}
        run: |
          # Idle until the ref, if any, is in place; the image's own startup
          # script then brings the GDK up, and its rspack service compiles
          # whatever frontend is checked out.
          docker run -d --name gdk --network host \
            --add-host gdk.test:127.0.0.1 \
            -e UNFURL_SERVER_URL=http://gdk.test:8081 \
            -v "$PWD/logs/gdk-services:/gitlab-gdk/gitlab-development-kit/log" \
            -v "$PWD/logs/gdk-rails:/gitlab-gdk/gitlab-development-kit/gitlab/log" \
            "$GDK_IMAGE" sleep infinity
          if [ -n "$REF" ]; then
            docker exec -u gdk -e REF="$REF" gdk bash -c '
              set -e
              eval "$(~/.local/bin/mise activate bash)"
              cd /gitlab-gdk/gitlab-development-kit/gitlab
              git fetch --depth=1 origin "$REF"
              git checkout --force FETCH_HEAD
              mise x -- bundle install --jobs 4
              mise x -- yarn install --immutable
              mise x -- bin/rake gettext:compile
              mise x -- gdk start postgresql redis
              RAILS_ENV=development mise x -- bin/rake db:migrate
              mise x -- gdk stop'
          fi
          docker exec -d gdk /home/gdk/gdk-container-startup.sh
          SECONDS=0
          # A hung request reports 000 rather than stalling the loop.
          while [ $SECONDS -lt 600 ]; do
            code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' http://gdk.test:3000/users/sign_in || true)
            [ "$code" = "200" ] && { echo "up after ${SECONDS}s"; break; }
            echo "${SECONDS}s: HTTP $code"
            sleep 10
          done
          [ "$code" = "200" ] || {
            curl -s --max-time 20 http://gdk.test:3000/users/sign_in | head -40
            timeout 120 docker exec -u gdk gdk bash -c 'cd /gitlab-gdk/gitlab-development-kit &&
              ~/.local/bin/mise x -- gdk status; tail -n 40 log/*/current gitlab/log/development.log' || true
            exit 1
          }

      # The GDK's own redis, on the shared host network, rather than a second
      # container: the image appends a TCP listener to its config for this. db 6
      # because GitLab holds 0-5 in development, per GDK's redis component.
      #
      # --add-host because --network host shares the network namespace but not
      # /etc/hosts: gdk.test is resolvable on the runner and not in here.
      #
      # UNFURL_HOME empty, not a path. With a home at all, a repository
      # redirect in its unfurl.yaml makes every environment importing std fail
      # to export, and one unexportable environment disables environment
      # creation for the whole dashboard.
      - name: Start the unfurl server
        run: |
          docker run -d --name unfurl --network host \
            --add-host gdk.test:127.0.0.1 \
            -v "$PWD/logs/unfurl:/logs" \
            -e UNFURL_HOME= \
            -e UNFURL_LOGGING=trace \
            -e UNFURL_LOGFILE=/logs/unfurl.log \
            -e CACHE_REDIS_URL=redis://127.0.0.1:6379/6 \
            -e UNFURL_PACKAGE_RULES='gitlab.com/onecommons/* unfurl.cloud/onecommons/* unfurl.cloud/onecommons/* http://gdk.test:3000/onecommons/*' \
            '${{ inputs.unfurl_image }}' \
            unfurl serve --port 8081 --cors http://gdk.test:3000 \
              --cloud-server http://gdk.test:3000 --clone-root /tmp/unfurl-repos

      # Deploy specs wait for their pipeline's job, so a runner has to take it;
      # see "A runner for deployment jobs" in .ai/oc.md. Instance-level because
      # each run signs up a new dashboard project, created per run so no
      # runner token ever lands in the image. DEPLOY_IMAGE overrides the
      # onecommons/ci default with the unfurl image under test. Host networking
      # for the job containers, like the GDK's, so they reach gdk.test:3000.
      - name: Start a runner
        env:
          DEPLOY_IMAGE: ${{ inputs.unfurl_image }}
        run: |
          cat > /tmp/runner.rb <<'RUBY'
          admin = User.admins.first
          response = Ci::Runners::CreateRunnerService.new(
            user: admin,
            params: { runner_type: 'instance_type', run_untagged: true, description: 'e2e' }
          ).execute
          abort(response.message.to_s) unless response.success?
          variable = Ci::InstanceVariable.find_or_initialize_by(key: 'DEPLOY_IMAGE')
          variable.update!(value: ENV.fetch('DEPLOY_IMAGE'), protected: false, masked: false)
          puts "RUNNER_TOKEN=#{response.payload[:runner].token}"
          RUBY
          docker cp /tmp/runner.rb gdk:/tmp/runner.rb
          token=$(docker exec -u gdk -e DEPLOY_IMAGE="$DEPLOY_IMAGE" gdk bash -c '
            eval "$(~/.local/bin/mise activate bash)" &&
            cd /gitlab-gdk/gitlab-development-kit/gitlab &&
            RAILS_ENV=development bin/rails runner /tmp/runner.rb' | sed -n 's/^RUNNER_TOKEN=//p')
          [ -n "$token" ] || { echo "no runner token"; exit 1; }
          echo "::add-mask::$token"
          docker run -d --name runner --network host \
            --add-host gdk.test:127.0.0.1 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            gitlab/gitlab-runner:v19.3.2
          docker exec runner gitlab-runner register --non-interactive \
            --url http://gdk.test:3000 --token "$token" \
            --executor docker --docker-image alpine:latest \
            --docker-network-mode host --docker-extra-hosts gdk.test:127.0.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: unfurl-gui
        run: npm i -g yarn && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      # OC_USERNAME and OC_PASSWORD must stay unset: with both, create-user.js
      # takes the admin path, which creates no dashboard. DRYRUN keeps the
      # provider specs from talking to a real cloud.
      - name: Cypress
        working-directory: unfurl-gui
        env:
          OC_URL: http://gdk.test:3000
          OC_INVITE_CODE: cypress-e2e
          DRYRUN: '1'
          # Placeholders, as in unfurl-gui's own CI: the environment forms
          # require them, and DRYRUN never sends them anywhere.
          AWS_ACCESS_KEY_ID: foobarbaz
          AWS_SECRET_ACCESS_KEY: asldfjkasldkjalqweioptuqpeortiu
          AWS_DEFAULT_REGION: eu-central-1
          AWS_DNS_ZONE: opencloudservices.net
          GCP_DNS_ZONE: deploythis.io
          GOOGLE_APPLICATION_CREDENTIALS: testing-shared/fixtures/service-account.json
        run: |
          yarn integration-test run --namespace onecommons/blueprints -- \
            --browser chrome -s "$SPECS"

      # The containers write some files, such as lock files, that only they can read.
      - name: Make the logs readable
        if: ${{ failure() || inputs.save_logs }}
        run: |
          docker logs runner > logs/runner.log 2>&1 || true
          sudo chmod -R a+rX logs

      - name: Upload logs
        if: ${{ failure() || inputs.save_logs }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          if-no-files-found: ignore

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: unfurl-gui/cypress/screenshots
          if-no-files-found: ignore
