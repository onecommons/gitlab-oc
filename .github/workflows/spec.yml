---
name: spec

"on":
  pull_request:
  push:
    branches: [main]
  # The heavy upstream specs, which are too slow for every push.
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      gdk_image:
        required: false
        default: ghcr.io/onecommons/gitlab-oc/gdk:latest
      only:
        description: >-
          Stages to run, comma-separated without spaces, from static,fast,oc,upstream,heavy,qa.
          Empty runs them all. Each runs as its own job, in parallel.
        required: false
        default: ''

env:
  GDK_IMAGE: ${{ inputs.gdk_image || 'ghcr.io/onecommons/gitlab-oc/gdk:latest' }}
  GITLAB: /gitlab-gdk/gitlab-development-kit/gitlab

jobs:
  # Which stages this run covers, as the matrix below runs them: one job each,
  # in parallel, so a run takes as long as its slowest stage plus setup rather
  # than the sum of them. heavy only runs nightly or when asked for.
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
      qa: ${{ steps.plan.outputs.qa }}
    steps:
      # A nightly with nothing new to test is skipped: same commit and same
      # image as the last nightly that passed. The image is rebuilt weekly, so
      # this still runs at least once a week. A failed nightly never matches,
      # so the next night tries again.
      - name: Compare with the last passing nightly
        id: nightly
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(docker buildx imagetools inspect "$GDK_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          mkdir -p nightly && echo "${{ github.sha }} $digest" > nightly/key
          echo "this nightly: $(cat nightly/key)"
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w spec.yml -e schedule -s success -L 1 \
            --json databaseId -q '.[0].databaseId')
          if [ -n "$last" ] && gh run download "$last" -R "$GITHUB_REPOSITORY" -n nightly-key -D last 2>/dev/null; then
            echo "last passing nightly ($last): $(cat last/key)"
            if cmp -s nightly/key last/key; then echo "unchanged=true" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Record what this nightly tests
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-key
          path: nightly/key

      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          EVENT: ${{ github.event_name }}
          UNCHANGED: ${{ steps.nightly.outputs.unchanged }}
        run: |
          stages="static fast oc upstream qa"
          case "$EVENT" in schedule|workflow_dispatch) stages="$stages heavy" ;; esac
          if [ -n "$ONLY" ]; then
            stages=$(for s in $stages; do case ",$ONLY," in *",$s,"*) echo "$s" ;; esac; done)
          fi
          if [ "$UNCHANGED" = true ]; then
            echo "Nothing new since the last passing nightly; skipping."
            stages=
          fi
          case " $stages " in *" qa "*) echo "qa=true" >> "$GITHUB_OUTPUT" ;; esac
          stages=$(for s in $stages; do [ "$s" = qa ] || echo "$s"; done)
          echo "stages=$(printf '%s\n' $stages | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  rspec:
    name: ${{ matrix.stage }}
    needs: plan
    if: ${{ needs.plan.outputs.stages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.stages) }}
    steps:
      # Hosted runners have had ~86 GB free, so nothing is cleared first; this
      # shows in the log if that ever shrinks.
      - name: Disk space
        run: df -h /

      # `sleep infinity` rather than the image's own command, which runs
      # `gdk restart` and brings up every service. Only four are needed
      # below, and rails-web is not among them.
      - name: Start the container
        run: |
          docker pull "$GDK_IMAGE"
          # The GDK's config names itself gdk.test, which nothing in the
          # container resolves otherwise.
          docker run -d --name gdk \
            --add-host gdk.test:127.0.0.1 \
            "$GDK_IMAGE" sleep infinity

      # The image bakes whatever ref it was built from; this moves it to the
      # one under test, keeping the gems, modules and migrated database that
      # make the image worth having.
      - name: Check out the pushed ref
        run: |
          docker exec -u gdk gdk bash -c '
            eval "$(~/.local/bin/mise activate bash)" &&
            cd '"$GITLAB"' &&
            git fetch --depth=1 origin ${{ github.sha }} &&
            git checkout --force FETCH_HEAD'

      - name: Install any moved dependencies
        run: |
          docker exec -u gdk gdk bash -c '
            eval "$(~/.local/bin/mise activate bash)" &&
            cd '"$GITLAB"' && mise x -- bundle install --jobs 4'

      # rspack because request specs under oc/spec/requests/projects render a
      # full page and read the asset manifest from its dev server; without it
      # Rails fails with "Could not load manifest".
      # The topology service because the GDK enables cells, and a spec that
      # builds records while loading claims them before spec_helper's stubs apply.
      - name: Start services
        run: |
          docker exec -u gdk gdk bash -c '
            eval "$(~/.local/bin/mise activate bash)" &&
            cd /gitlab-gdk/gitlab-development-kit &&
            mise x -- gdk start postgresql redis rspack gitlab-topology-service'

      - name: Migrate the test database
        run: |
          docker exec -u gdk gdk bash -c '
            eval "$(~/.local/bin/mise activate bash)" &&
            cd '"$GITLAB"' && RAILS_ENV=test mise x -- bin/rake db:migrate'

      # static: Override.verify! raises when a method an `override` names has
      # gone from upstream -- the first thing a rebase breaks, and silent
      # otherwise because the fork's method simply stops being called.
      #
      # fast: fast_spec_helper specs need neither database nor Gitaly and
      # cannot share an invocation with spec_helper ones.
      #
      # upstream: the upstream examples covering files the fork edits in place.
      # oc/spec cannot see these: it tests the fork's own code, while these
      # assert what upstream expects of code the fork changed underneath it.
      # The list is derived from the `# OC Change` markers, so it follows the
      # edits. Quarantined examples are skipped as in upstream CI.
      #
      # heavy: four files that are most of half an hour, because the fork edits
      # big upstream classes. Nightly rather than per-push, so a regression in
      # them surfaces within a day instead of holding up every merge.
      - name: Run ${{ matrix.stage }}
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          case "$STAGE" in
            static)   cmd='bundle exec rake lint:static_verification' ;;
            fast)     cmd='bundle exec rspec oc/spec/lib/gitlab_edition_spec.rb $(ruby oc/scripts/upstream_specs.rb --fast)' ;;
            oc)       cmd='bundle exec rspec oc/spec --exclude-pattern "**/gitlab_edition_spec.rb"' ;;
            upstream) cmd='bundle exec rspec --tag ~quarantine $(ruby oc/scripts/upstream_specs.rb)' ;;
            heavy)    cmd='bundle exec rspec --tag ~quarantine $(ruby oc/scripts/upstream_specs.rb --heavy)' ;;
          esac
          # $cmd's own $(...) expands in the container, not here.
          docker exec -u gdk -e ENABLE_RSPACK=true gdk bash -c \
            "eval \"\$(~/.local/bin/mise activate bash)\" && cd $GITLAB && mise x -- bash -c '$cmd'"

      # A killed run leaves a transaction open on `shards` that poisons every
      # later suite, so a cancelled job should not leave the container behind.
      - name: Stop the container
        if: ${{ always() }}
        run: docker rm -f gdk || true

  # The fork's QA end-to-end specs (qa/qa/specs/features/oc), against a
  # running GDK: everything starts, Sidekiq included, since every step they
  # check is asynchronous. They run on the runner, as oc/spec/README.md runs
  # them, with the QA bundle rather than the GDK's.
  qa:
    name: qa
    needs: plan
    if: ${{ needs.plan.outputs.qa == 'true' }}
    runs-on: ubuntu-latest
    env:
      QA_GITLAB_URL: http://gdk.test:3000
      GITHUB_FIXTURE: aszs/gitlab-qa-import-fixture
      # Job-wide so `bundle exec` agrees with the install. The development
      # group's ruby-debug-ide does not build on this Ruby.
      BUNDLE_WITHOUT: development
    steps:
      - uses: actions/checkout@v4

      - name: Resolve gdk.test
        run: echo "127.0.0.1 gdk.test" | sudo tee -a /etc/hosts

      - name: Pull the GDK image
        run: docker pull "$GDK_IMAGE"

      # As e2e.yml starts it; see the notes there. The one-second sync delay
      # is oc/spec/README.md's: the default ten lands on the critical path
      # eight times.
      - name: Start the GDK
        id: gdk
        run: |
          docker run -d --name gdk --network host \
            --add-host gdk.test:127.0.0.1 \
            "$GDK_IMAGE" sleep infinity
          docker exec -u gdk -e REF="$GITHUB_SHA" gdk bash -c '
            set -e
            eval "$(~/.local/bin/mise activate bash)"
            cd /gitlab-gdk/gitlab-development-kit
            echo "export OC_WORK_ITEMS_SYNC_DELAY=1" >> env.runit
            cd gitlab
            git fetch --depth=1 origin "$REF"
            git checkout --force FETCH_HEAD
            mise x -- bundle install --jobs 4
            mise x -- yarn install --immutable
            mise x -- bin/rake gettext:compile
            mise x -- gdk start postgresql redis
            RAILS_ENV=development mise x -- bin/rake db:migrate
            mise x -- gdk stop'
          docker exec -d gdk /home/gdk/gdk-container-startup.sh
          SECONDS=0
          while [ $SECONDS -lt 600 ]; do
            code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "$QA_GITLAB_URL/users/sign_in" || true)
            [ "$code" = "200" ] && { echo "up after ${SECONDS}s"; break; }
            echo "${SECONDS}s: HTTP $code"
            sleep 10
          done
          [ "$code" = "200" ] || {
            timeout 120 docker exec -u gdk gdk bash -c 'cd /gitlab-gdk/gitlab-development-kit &&
              ~/.local/bin/mise x -- gdk status; tail -n 40 log/*/current gitlab/log/development.log' || true
            exit 1
          }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.11'
          working-directory: qa
          bundler-cache: true

      # Every spec under oc/, so a new one needs no entry here. The GDK's
      # seeded root token is the framework's default admin token. The GitHub
      # import specs (:github) need a token with repo scope, which a fork's PR
      # is never given, so without one they are left out.
      - name: QA specs
        working-directory: qa
        env:
          QA_GITHUB_ACCESS_TOKEN: ${{ secrets.QA_GITHUB_ACCESS_TOKEN }}
          QA_GITHUB_IMPORT_REPOSITORY: ${{ env.GITHUB_FIXTURE }}
        run: |
          tags=
          if [ -z "$QA_GITHUB_ACCESS_TOKEN" ]; then
            echo "::notice::No QA_GITHUB_ACCESS_TOKEN secret; skipping the GitHub import specs."
            tags='--tag ~github'
          fi
          bundle exec rspec $tags qa/specs/features/oc

      # Each import leaves a webhook on the fixture pointing at gdk.test, which
      # GitHub can never reach, and a repository holds at most 20.
      - name: Remove the fixture's gdk.test webhooks
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.QA_GITHUB_ACCESS_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          gh api "repos/$GITHUB_FIXTURE/hooks" --paginate \
            -q '.[] | select(.config.url | contains("gdk.test")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_FIXTURE/hooks/$id"; done

      - name: Stop the container
        if: ${{ always() }}
        run: docker rm -f gdk || true
